function dailyTaskTemplate(topic, practical){
  return [
    `Theory (1 hr): Study ${topic} — read docs / notes, no video-hopping`,
    `Coding (1 hr): ${practical}`,
    `Project/practical (1 hr): Apply ${topic} to your own mini example or ongoing project`,
    `Questions (30 min): Write your own answer to 1-2 AI Engineer interview questions on ${topic}, then check yourself`,
    `Revision (30 min): Summarize today's topic in 3-5 lines in your notes`
  ];
}

function buildCurriculum(){
  const days=[];
  for (let d=1; d<=90; d++){
    const raw=RAW_DAYS[d];
    const phase=PHASES.find(p => d>=p.start && d<=p.end);
    const [topic, practical, area, isExam] = raw;
    days.push({
      day:d, phaseId:phase.id, phaseName:phase.name,
      topic, practical, area, isExam: !!isExam,
      tasks: isExam ? null : dailyTaskTemplate(topic, practical)
    });
  }
  return days;
}
const CURRICULUM = buildCurriculum();

let view = { screen:"dashboard" };
let saveTimer=null, syncStatus="local"; // local | saving | synced | error | offline | nogh

const LOCAL_KEY = 'ai90-progress';
const CFG_KEY = 'ai90-gh-config'; // { owner, repo, path, token }

function getConfig(){
  try{ return JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); }catch(e){ return null; }
}
function setConfig(cfg){ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
function ghReady(){ const c=getConfig(); return !!(c && c.owner && c.repo && c.token); }

function ensureDay(d){
  if (!STATE.days[d]){
    const c=CURRICULUM[d-1];
    STATE.days[d] = {
      tasksDone: c.isExam ? null : c.tasks.map(()=>false),
      examScores: c.isExam ? { mcq:null, short:null, coding:null, interview:null } : null,
      notes:"", completed:false
    };
  }
  return STATE.days[d];
}

function readLocal(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if (raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function writeLocal(state){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); }catch(e){}
}

// --- GitHub Contents API sync ---
let ghSha = null; // current file sha, for updates
async function ghFetch(){
  const cfg = getConfig();
  if (!cfg || !cfg.owner || !cfg.repo || !cfg.token) return null;
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path||'progress.json'}`;
  const res = await fetch(url, { headers: { 'Authorization': `Bearer ${cfg.token}`, 'Accept':'application/vnd.github+json' } });
  if (res.status === 404) { ghSha = null; return null; }
  if (!res.ok) throw new Error('GitHub fetch failed: '+res.status);
  const data = await res.json();
  ghSha = data.sha;
  const decoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
  return JSON.parse(decoded);
}
async function ghPut(state){
  const cfg = getConfig();
  if (!cfg || !cfg.owner || !cfg.repo || !cfg.token) return;
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path||'progress.json'}`;
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(state, null, 2))));
  const body = { message: `Update progress — day ${currentDay()}`, content, branch: cfg.branch || 'main' };
  if (ghSha) body.sha = ghSha;
  const res = await fetch(url, {
    method:'PUT',
    headers:{ 'Authorization': `Bearer ${cfg.token}`, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok){
    const errText = await res.text();
    throw new Error('GitHub save failed: '+res.status+' '+errText);
  }
  const data = await res.json();
  ghSha = data.content.sha;
}

async function loadState(){

  if (local) STATE = Object.assign({days:{}, lastPosition:null, updatedAt:0}, local);

  if (!ghReady()){
    syncStatus = "nogh";
    render();
    return;
  }
  syncStatus = "saving"; render();
  try{
    const remote = await ghFetch();
    if (remote && (remote.updatedAt||0) > (STATE.updatedAt||0)){
      STATE = Object.assign({days:{}, lastPosition:null, updatedAt:0}, remote);
      writeLocal(STATE);
    } else if (local && local.updatedAt){
      // local is newer or equal — push it up
      await ghPut(STATE);
    } else if (!remote) {
      await ghPut(STATE);
    }
    syncStatus = "synced";
  }catch(e){
    console.error(e);
    syncStatus = navigator.onLine ? "error" : "offline";
  }
  render();
}

async function saveState(){
  STATE.updatedAt = Date.now();
  writeLocal(STATE);
  syncStatus = ghReady() ? "saving" : "local";
  updateSyncDot();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if (!ghReady()){ syncStatus="local"; updateSyncDot(); return; }
    try{ await ghPut(STATE); syncStatus="synced"; }
    catch(e){ console.error(e); syncStatus = navigator.onLine ? "error" : "offline"; }
    updateSyncDot();
  }, 600);
}

function updateSyncDot(){
  const dot=document.getElementById('sync-dot'); if(!dot) return;
  const map = {
    saving: ["saving", "Syncing to GitHub…"],
    synced: ["", "Synced to GitHub — up to date on all devices"],
    error: ["error", "Sync failed — saved locally, will retry"],
    offline: ["error", "Offline — saved locally, will sync when back online"],
    local: ["local", "Saved on this device only — add GitHub sync in Settings"],
    nogh: ["local", "Not connected to GitHub yet — open Settings to enable cross-device sync"]
  };
  const [cls, title] = map[syncStatus] || ["",""];
  dot.className = "sync-dot" + (cls?" "+cls:"");
  dot.title = title;
  const lbl = document.getElementById('sync-label');
  if (lbl){
    const labelMap = { saving:"SYNCING", synced:"GITHUB-SYNCED", error:"SYNC ERROR", offline:"OFFLINE", local:"LOCAL ONLY", nogh:"SET UP SYNC" };
    lbl.textContent = labelMap[syncStatus] || "";
  }
}

/* ============== HELPERS ============== */
function stats(){
  let completed=0, examsTaken=0, scoreSum=0, scoreCount=0;
  for (let d=1; d<=90; d++){
    const s=STATE.days[d];
    if (s && s.completed) completed++;
    if (s && s.examScores){
      const parts=[s.examScores.mcq,s.examScores.short,s.examScores.coding,s.examScores.interview].filter(v=>v!==null&&v!==undefined&&v!=="");
      if (parts.length){ examsTaken++; scoreSum += parts.reduce((a,b)=>a+Number(b),0)/parts.length; scoreCount++; }
    }
  }
  const avgScore = scoreCount ? Math.round(scoreSum/scoreCount) : null;
  return { completed, examsTaken, avgScore, streak:computeStreak() };
}
function computeStreak(){
  let streak=0;
  for (let d=90; d>=1; d--){
    const s=STATE.days[d];
    if (s && s.completed) streak++;
    else if (streak>0) break;
  }
  return streak;
}
function currentDay(){
  for (let d=1; d<=90; d++){ const s=STATE.days[d]; if (!s || !s.completed) return d; }
  return 90;
}
function areaStats(){
  const map={};
  AREAS.forEach(a=>map[a]={total:0,done:0});
  for (let d=1; d<=90; d++){
    const c=CURRICULUM[d-1]; const s=STATE.days[d];
    map[c.area].total++;
    if (s && s.completed) map[c.area].done++;
  }
  return map;
}

/* ============== SCREENS ============== */
function renderDashboard(){
  const st=stats(); const cur=currentDay();
  let resumeHtml="";
  if (STATE.lastPosition && STATE.lastPosition.day){
    resumeHtml=`<div class="resume-banner show">
      <span>▸ You stopped at <b>Day ${STATE.lastPosition.day}</b>${STATE.lastPosition.taskIndex!=null?`, task ${STATE.lastPosition.taskIndex+1}`:""}. Resume on any device.</span>
      <button onclick="goToDay(${STATE.lastPosition.day})">Resume</button>
    </div>`;
  }
  let phaseCards = PHASES.map(p=>{
    let done=0, len=p.end-p.start+1;
    for (let d=p.start; d<=p.end; d++){ if (STATE.days[d] && STATE.days[d].completed) done++; }
    const pct=Math.round((done/len)*100);
    return `<div class="phase-card" onclick="openPhase(${p.id})">
      <div class="phase-head"><span class="phase-name">P${p.id} · ${p.name}</span><span class="phase-range">Day ${p.start}–${p.end} · ${done}/${len}</span></div>
      <div class="phase-bar-wrap"><div class="phase-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join("");
  const cd=CURRICULUM[cur-1];
  return `
    <div class="resume-banner-slot">${resumeHtml}</div>
    <div class="dash">
      <div class="stat"><div class="num">${st.completed}/90</div><div class="lbl">Days Complete</div></div>
      <div class="stat"><div class="num">${st.streak}</div><div class="lbl">Day Streak</div></div>
      <div class="stat"><div class="num">${st.examsTaken}/5</div><div class="lbl">Exams Logged</div></div>
      <div class="stat"><div class="num">${st.avgScore!==null?st.avgScore+'%':'—'}</div><div class="lbl">Avg Exam Score</div></div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" style="width:${(st.completed/90*100)}%"></div>
      <div class="progress-bar-label">${st.completed} / 90 DAYS · ${Math.round(st.completed/90*100)}%</div>
    </div>
    <div class="section-lbl">Today's Focus — Day ${cur}</div>
    <div class="day-row current ${cd.isExam?'exam':''}" onclick="goToDay(${cur})">
      <span class="day-num">D${cur}</span><span class="day-check"></span>
      <span class="day-title-txt">${cd.topic}</span>
      <span class="day-type ${cd.isExam?'exam-tag':''}">${cd.isExam?'exam':cd.area}</span>
    </div>
    <div class="section-lbl">Phases</div>
    ${phaseCards}
  `;
}

function renderPhase(phaseId){
  const phase=PHASES.find(p=>p.id===phaseId);
  let rows="";
  for (let d=phase.start; d<=phase.end; d++){
    const c=CURRICULUM[d-1]; const s=STATE.days[d]; const done=s&&s.completed;
    rows+=`<div class="day-row ${done?'done':''} ${c.isExam?'exam':''}" onclick="goToDay(${d})">
      <span class="day-num">D${d}</span><span class="day-check">${done?'✓':''}</span>
      <span class="day-title-txt">${c.topic}</span>
      <span class="day-type ${c.isExam?'exam-tag':''}">${c.isExam?'exam':c.area}</span>
    </div>`;
  }
  return `<span class="back-link" onclick="goDashboard()">← ALL PHASES</span>
    <div class="section-lbl">Phase ${phase.id} · ${phase.name} (Day ${phase.start}–${phase.end})</div>
    ${rows}`;
}

function renderDay(d){
  const c=CURRICULUM[d-1]; const s=ensureDay(d);
  const practicalBox = !c.isExam ? `<div class="practical-box"><b>Practical / Focus</b>${c.practical}</div>` : "";

  let body;
  if (c.isExam){
    const parts=[
      {key:'mcq', label:'PART A — MCQ (10 questions)'},
      {key:'short', label:'PART B — Short Answer (5 questions)'},
      {key:'coding', label:'PART C — Coding (2 problems)'},
      {key:'interview', label:'PART D — Interview (3 questions)'}
    ];
    const grid = parts.map(p=>`
      <div class="exam-part">
        <div class="exam-part-lbl">${p.label}</div>
        <input type="number" min="0" max="100" placeholder="score %" value="${s.examScores[p.key] ?? ''}" onchange="setExamPart(${d},'${p.key}',this.value)">
      </div>`).join("");
    const vals=[s.examScores.mcq,s.examScores.short,s.examScores.coding,s.examScores.interview].filter(v=>v!==null&&v!==undefined&&v!=="");
    const avg = vals.length ? Math.round(vals.reduce((a,b)=>a+Number(b),0)/vals.length) : null;
    body = `
      <div class="practical-box"><b>Invigilator rules</b>Answer first, mark yourself honestly against the answer key or your own review, then log each part's score. Don't peek before attempting.</div>
      <div class="section-lbl">Exam — ${c.topic}</div>
      <div class="exam-grid">${grid}</div>
      <div class="exam-avg">Overall exam score: ${avg!==null?avg+'%':'— log all 4 parts'}</div>
    `;
  } else {
    const tasksHtml = c.tasks.map((t,i)=>`
      <li class="task-item">
        <button class="task-checkbox ${s.tasksDone[i]?'checked':''}" onclick="toggleTask(${d},${i})">${s.tasksDone[i]?'✓':''}</button>
        <span class="task-text ${s.tasksDone[i]?'done':''}">${t}</span>
      </li>`).join("");
    body = `${practicalBox}<div class="section-lbl">Today's Schedule</div><ul class="task-list">${tasksHtml}</ul>`;
  }

  const allDone = c.isExam ? true : s.tasksDone.every(Boolean);

  return `
    <span class="back-link" onclick="openPhase(${c.phaseId})">← PHASE ${c.phaseId}</span>
    <div class="detail-card">
      <div class="detail-head">
        <div><div class="detail-title">Day ${d} — ${c.topic}</div><div class="detail-phase">Phase ${c.phaseId} · ${c.phaseName}</div></div>
        <span class="day-type ${c.isExam?'exam-tag':''}">${c.isExam?'exam':c.area}</span>
      </div>
      ${body}
      <div class="section-lbl">Notes</div>
      <textarea placeholder="Jot notes, gotchas, links..." onchange="setNotes(${d}, this.value)">${s.notes||""}</textarea>
      <div>
        <button class="mark-day-btn ${s.completed?'done':''}" onclick="toggleDayComplete(${d})">${s.completed?'✓ Day Complete':allDone?'Mark Day Complete':'Mark Day Complete Anyway'}</button>
        <button class="stop-btn" onclick="stopHere(${d})">Stop Here / Save Position</button>
      </div>
      <div class="nav-btns">
        <button onclick="goToDay(${d-1})" ${d<=1?'disabled':''}>← Day ${d-1}</button>
        <button onclick="goToDay(${d+1})" ${d>=90?'disabled':''}>Day ${d+1} →</button>
      </div>
    </div>
  `;
}

function renderAreas(){
  const map=areaStats();
  const rows = AREAS.map(a=>{
    const {total,done}=map[a];
    const pct = total ? Math.round(done/total*100) : 0;
    return `<div class="area-row">
      <span class="area-name">${a}</span>
      <div class="area-bar-wrap"><div class="area-bar-fill" style="width:${pct}%"></div></div>
      <span class="area-pct">${done}/${total}</span>
    </div>`;
  }).join("");
  return `<div class="section-lbl">Area Progress</div>${rows}
    <div class="section-lbl" style="margin-top:24px;">Portfolio Projects</div>
    ${PROJECTS.map(p=>`<div class="proj-card"><div class="proj-title">${p.name}</div><div class="proj-days">Days ${p.days}</div><div class="proj-tech">${p.tech}</div></div>`).join("")}
  `;
}

function renderSettings(){
  const cfg = getConfig() || {};
  return `
    <div class="section-lbl">Cross-Device Sync (GitHub)</div>
    <div class="practical-box">
      <b>How this works</b>
      Your progress is saved on this device immediately, always — even offline. If you fill in your GitHub details below,
      it also pushes to a private JSON file in a repo of your choice, so opening this same app on another device
      (logged into nothing — just this repo config) pulls the latest copy automatically.
    </div>
    <div class="detail-card">
      <div class="section-lbl" style="margin-top:0;">GitHub username (owner)</div>
      <textarea id="cfg-owner" style="min-height:38px;" placeholder="sktelasang990">${cfg.owner||''}</textarea>
      <div class="section-lbl">Repository name</div>
      <textarea id="cfg-repo" style="min-height:38px;" placeholder="ai-engineer-90-tracker">${cfg.repo||''}</textarea>
      <div class="section-lbl">Branch</div>
      <textarea id="cfg-branch" style="min-height:38px;" placeholder="main">${cfg.branch||'main'}</textarea>
      <div class="section-lbl">File path</div>
      <textarea id="cfg-path" style="min-height:38px;" placeholder="progress.json">${cfg.path||'progress.json'}</textarea>
      <div class="section-lbl">Personal Access Token</div>
      <textarea id="cfg-token" style="min-height:38px;" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">${cfg.token||''}</textarea>
      <div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);margin-top:6px;line-height:1.6;">
        Needs a fine-grained token scoped to just this one repo, Contents: Read & write.
        You enter this once per device — it's stored only in this browser's local storage, never sent anywhere but GitHub's API.
      </div>
      <button class="mark-day-btn" style="margin-right:8px;" onclick="saveGhConfig()">Save & Sync Now</button>
      ${cfg.token ? `<button class="stop-btn" onclick="clearGhConfig()">Disconnect</button>` : ``}
    </div>
  `;
}

async function saveGhConfig(){
  const owner = document.getElementById('cfg-owner').value.trim();
  const repo = document.getElementById('cfg-repo').value.trim();
  const branch = document.getElementById('cfg-branch').value.trim() || 'main';
  const path = document.getElementById('cfg-path').value.trim() || 'progress.json';
  const token = document.getElementById('cfg-token').value.trim();
  if (!owner || !repo || !token){ alert('Fill in owner, repo, and token at minimum.'); return; }
  setConfig({ owner, repo, branch, path, token });
  await loadState();
  goDashboard();
}
function clearGhConfig(){
  localStorage.removeItem(CFG_KEY);
  syncStatus = "nogh";
  openSettings();
}

/* ============== ACTIONS ============== */
function goDashboard(){ view={screen:"dashboard"}; render(); }
function openPhase(id){ view={screen:"phase", phaseId:id}; render(); }
function goToDay(d){ if(d<1||d>90) return; view={screen:"day", day:d}; render(); }
function openAreas(){ view={screen:"areas"}; render(); }
function openSettings(){ view={screen:"settings"}; render(); }

function toggleTask(d,i){
  const s=ensureDay(d); s.tasksDone[i]=!s.tasksDone[i];
  STATE.lastPosition={day:d, taskIndex:i}; saveState(); render();
}
function setNotes(d,val){ ensureDay(d).notes=val; saveState(); }
function setExamPart(d,part,val){
  const s=ensureDay(d);
  s.examScores[part] = val===""?null:Math.max(0,Math.min(100,Number(val)));
  saveState(); render();
}
function toggleDayComplete(d){
  const s=ensureDay(d); s.completed=!s.completed;
  if (s.completed) STATE.lastPosition={day:Math.min(d+1,90), taskIndex:null};
  saveState(); render();
}
function stopHere(d){ STATE.lastPosition={day:d, taskIndex:null}; saveState(); goDashboard(); }

/* ============== MAIN RENDER ============== */
function render(){
  const app=document.getElementById('app');
  let body="";
  if (view.screen==="dashboard") body=renderDashboard();
  else if (view.screen==="phase") body=renderPhase(view.phaseId);
  else if (view.screen==="day") body=renderDay(view.day);
  else if (view.screen==="areas") body=renderAreas();
  else if (view.screen==="settings") body=renderSettings();

  app.innerHTML = `
    <header class="top">
      <div class="stamp-row">
        <h1>90-Day AI Engineer Logbook</h1>
        <span class="entry-id" onclick="openSettings()" style="cursor:pointer;"><span id="sync-dot" class="sync-dot"></span><span id="sync-label">SYNC</span></span>
      </div>
      <div class="subtitle">Python → ML → Deep Learning → GenAI/LLM → RAG → Agents → Deployment → Portfolio · 5 Exams</div>
    </header>
    <div class="tabs">
      <button class="tab ${view.screen==='dashboard'?'active':''}" onclick="goDashboard()">Dashboard</button>
      <button class="tab ${view.screen==='phase'||view.screen==='day'?'active':''}" onclick="openPhase(currentPhaseFor(currentDay()))">Roadmap</button>
      <button class="tab ${view.screen==='areas'?'active':''}" onclick="openAreas()">Areas & Projects</button>
      <button class="tab ${view.screen==='settings'?'active':''}" onclick="openSettings()">Settings</button>
    </div>
    ${body}
    <footer class="foot">DAY ${currentDay()} OF 90 · SAVED TO YOUR ACCOUNT · OPEN ON MOBILE OR DESKTOP TO CONTINUE</footer>
  `;
  updateSyncDot();
}
function currentPhaseFor(d){ return PHASES.find(p=>d>=p.start&&d<=p.end).id; }

loadState();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW registration failed', e));
  });
}
window.addEventListener('online', () => { if (syncStatus==='offline'||syncStatus==='error') saveState(); });
</script>
</body>
